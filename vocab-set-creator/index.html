<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bokogo Vocab Sets</title>
<meta name="description" content="Make vocabulary sets (word, picture, IPA, meaning, sentences, dialogues, stories) and print them as worksheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Andika:wght@400;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{
 --p:#14b8a6;--p6:#0d9488;--p7:#0f766e;--mint:#ccfbf1;--mint2:#f0fdfa;
 --ink:#111827;--muted:#5f6b6a;--line:#dfe7e5;--bg:#eef3f2;--paper:#fff;--s2:#f6f9f8;
 --amber:#fbbf24;--ambb:#fef3c7;--red:#e11d48;--redb:#ffe4ec;
 --L:#c2410c;--Lb:#fff1dc;--S:#7c3aed;--Sb:#efe9ff;--R:#1d4ed8;--Rb:#e3edff;--W:#be123c;--Wb:#ffe4ec;--X:#6d28d9;--Xb:#f3eefe;
 --ui:'Sarabun',system-ui,sans-serif;--kid:'Andika','Sarabun',system-ui,sans-serif;
 --emo:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
 --r:12px;--top:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--bg);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{font-size:16px}
[hidden]{display:none!important}
.emo{font-family:var(--emo)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;background:var(--paper);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;white-space:nowrap}
.logo i{font-style:normal;width:30px;height:30px;border-radius:9px;background:linear-gradient(#0d9488,#047857);color:#fff;display:grid;place-items:center;font-weight:800}
.logo small{font-weight:600;color:var(--muted);font-size:13px}
.sp{flex:1;min-width:0}
.ib{text-decoration:none;color:inherit;height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;white-space:nowrap}
.ib:hover{background:var(--s2)}
.ib.pri{background:var(--p7);border-color:var(--p7);color:#fff!important}
.ib.pri:hover{background:#0b5f58}
.ib .lb{font-size:14px}
.bigemo{font-size:24px;font-family:var(--emo);line-height:1}
.nm{flex:1;min-width:0;height:40px;border:1px solid transparent;border-radius:10px;padding:0 10px;font-weight:800;font-size:18px;background:transparent}
.nm:hover{border-color:var(--line)}.nm:focus{outline:none;border-color:var(--p);background:var(--paper)}

/* ---------- library ---------- */
.libw{max-width:1200px;margin:0 auto;padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px))}
.lh{display:flex;align-items:center;gap:8px;margin:2px 2px 12px}
.lh h2{margin:0;font-size:17px}
.lh .muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.vcard{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;position:relative}
.vcard:hover{border-color:var(--p)}
.vc1{display:flex;gap:10px;align-items:center}
.vc1 .ic{width:48px;height:48px;border-radius:14px;background:var(--mint2);display:grid;place-items:center;font-size:30px;font-family:var(--emo);flex:none;overflow:hidden}
.vc1 .ic img{width:100%;height:100%;object-fit:cover}
.vc1 b{font-size:16.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{display:flex;gap:10px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.cnt span{white-space:nowrap}
.strip{display:flex;gap:6px;overflow:hidden}
.strip span{width:40px;height:40px;flex:none;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:24px;font-family:var(--emo);overflow:hidden}
.strip span img{width:100%;height:100%;object-fit:contain}
.vca{display:flex;gap:8px}
.vca .ib{flex:1}
.ltabs{display:flex;gap:6px;background:var(--s2);padding:4px;border-radius:14px;margin:0 0 12px;max-width:440px}
.lt{flex:1;height:38px;border:0;border-radius:11px;background:transparent;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.lt.on{background:var(--paper);color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.allq{margin:-4px 0 12px}.allq input{width:100%;max-width:440px;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--paper)}
.own{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.own.me{color:var(--p7);font-weight:700}
#saveB.saved{background:var(--paper);border-color:var(--line);color:var(--muted)!important}
.cbtn{position:relative}.cdot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:transparent}
.cdot.on{background:#2e9d5b}.cdot.busy{background:#e8a23a}.cdot.err,.cdot.offline{background:#d9534f}
.cl-st{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--soft,#f4f1ea);margin-bottom:12px}.cl-st b{display:block}
.cl-tabs{display:flex;gap:8px;margin-bottom:12px}.cl-tabs .ib{flex:1}.cl-tabs .ib.on{background:var(--ink,#222);color:#fff;border-color:transparent}
.empty{background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .big{font-size:56px;font-family:var(--emo);line-height:1}
.empty p{margin:0;color:var(--muted);max-width:420px}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;height:54px;padding:0 20px;border-radius:27px;border:0;background:var(--p7);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(15,118,110,.35)}

/* ---------- editor ---------- */
.edb{display:flex;min-height:calc(100dvh - var(--top))}
.side{display:none}
.main{flex:1;min-width:0;container:main/inline-size;display:flex;flex-direction:column}
.tabs{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:15;display:flex;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:76px;border:0;background:none;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;font-size:12.5px}
.tabs button .e{font-size:20px;font-family:var(--emo);line-height:1.1}
.tabs button .n{font-size:11.5px;background:var(--s2);border-radius:9px;padding:0 6px;font-weight:700}
.tabs button.on{color:var(--p7);border-bottom-color:var(--p7)}
.tabs button.on .n{background:var(--mint);color:var(--p7)}
.tools{display:flex;gap:6px;padding:10px 10px 4px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--p)}
.chip.ai{background:linear-gradient(90deg,#f0fdfa,#f5f3ff);border-color:#c4b5fd}.chip.warn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.chip.on{background:var(--p7);color:#fff;border-color:var(--p7)}
.chip:disabled{opacity:.55}
.pane{flex:1;padding:6px 10px 12px}
.hint{color:var(--muted);font-size:13px;line-height:1.45}
.hint code{background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:0 4px;font-size:12.5px}

/* word list */
.wl{display:flex;flex-direction:column;gap:8px}
.wh{display:none}
.wr{display:grid;grid-template-columns:64px 1fr 40px;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px}
.wr.new{animation:fl 1.2s}
@keyframes fl{0%{background:var(--mint)}100%{background:var(--paper)}}
.pk{width:64px;height:64px;border-radius:12px;border:1.5px dashed #b9cbc7;background:var(--s2);display:grid;place-items:center;font-size:38px;font-family:var(--emo);line-height:1;padding:0;overflow:hidden;position:relative}
.pk.has{border-style:solid;border-color:var(--line);background:#fff}
.pk img{width:100%;height:100%;object-fit:contain}
.pk .add{font-size:22px;opacity:.6}
.pk.ov{border-color:var(--p);background:var(--mint)}
.pk .ai{position:absolute;right:2px;bottom:2px;font-size:11px;background:#ede9fe;border-radius:6px;padding:0 3px}
.f{min-width:0;display:flex;flex-direction:column;gap:4px}
.fi{width:100%;min-width:0;height:34px;border:1px solid transparent;border-radius:8px;padding:0 8px;background:transparent}
.fi:hover{border-color:var(--line)}
.fi:focus{outline:none;border-color:var(--p);background:#fff}
.fw_{font-family:var(--kid);font-weight:700;font-size:19px;height:36px}
.f2{display:flex;gap:4px;min-width:0}
.fx{flex:1;min-width:0;display:flex;align-items:center;background:var(--s2);border-radius:8px;padding-left:6px}
.fx>span{flex:none;color:var(--muted);font-size:13px}
.fx .fi{height:30px;font-size:14px}
.fx.ipa .fi{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:400;color:#0f766e}
.fx.miss{background:#fff7e6}
.acs{display:flex;flex-direction:column;gap:4px}
.mini{width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:16px;font-family:var(--emo);padding:0}
.mini:hover{background:var(--s2)}
.mini.del:hover{background:var(--redb);border-color:#fda4af}
.addbar{position:sticky;bottom:0;z-index:12;background:linear-gradient(transparent,var(--bg) 14px);padding:14px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.addbar form{display:flex;gap:8px;background:var(--paper);border:1.5px solid var(--p);border-radius:16px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.addbar input{flex:1;min-width:0;border:0;outline:none;padding:0 8px;font-family:var(--kid);font-size:18px;background:transparent}
.addbar button{height:42px;padding:0 16px;border:0;border-radius:12px;background:var(--p7);color:#fff;font-weight:800;font-size:16px}
.cntline{display:flex;align-items:center;gap:8px;margin:2px 2px 8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.cntline b{color:var(--ink)}
.dropzone{border:2px dashed var(--p);background:var(--mint2);border-radius:16px;padding:18px;text-align:center;color:var(--p7);font-weight:700;display:none}
body.dragging .dropzone{display:block}

/* text tabs */
.tx{display:flex;flex-direction:column;gap:10px}
.tx textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-family:var(--kid);font-size:16px;line-height:1.6;resize:vertical;background:var(--paper)}
.tx textarea:focus{outline:none;border-color:var(--p)}
.fmt{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fmt summary{font-weight:700;cursor:pointer;font-size:14px}
.fmt pre{margin:8px 0 0;white-space:pre-wrap;font-family:var(--kid);font-size:14px;background:var(--s2);border-radius:10px;padding:8px 10px}
.pv{display:flex;flex-direction:column;gap:6px}
.pvr{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:24px 1fr 38px;gap:8px;align-items:center}
.pvr .no{color:var(--muted);font-weight:700;font-size:13px;text-align:center}
.pvr .en{font-family:var(--kid);font-size:16px}
.pvr .en mark{background:var(--mint);color:var(--p7);border-radius:4px;padding:0 2px;font-weight:700}
.pvr .en .bl{border-bottom:2px solid var(--p7);color:var(--p7);font-weight:700;padding:0 4px}
.pvr .th{color:var(--muted);font-size:14px}
.pvr .th.miss{color:#b45309}
.pvr .ip{color:#0f766e;font-size:13px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:400}
.story{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.story .st{font-family:var(--kid);font-size:15.5px;margin-bottom:6px}
.story .q{font-size:14px;padding:3px 0;border-top:1px dashed var(--line)}
.story .q b{color:var(--R)}
.story .q small{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border-radius:9px;padding:1px 8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.badge.warn{background:#fff7e6;color:#b45309}
.badge.ok{background:var(--mint);color:var(--p7)}

/* side panel content (also used in the ⋮ sheet) */
.sc{display:flex;flex-direction:column;gap:14px}
.sc h3{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;color:var(--muted);font-weight:700}
.fld select,.fld input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--paper);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wst{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wst a{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--paper);position:relative;min-width:0}
.wst a:hover{border-color:var(--p)}
.wst a .cd{font-size:11px;font-weight:800;border-radius:6px;padding:0 5px;color:#fff}
.wst a .nm2{font-size:12.5px;font-weight:700;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.wst a.dim{opacity:.55}
.wst a .dot{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.wsbig{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;background:var(--p7);color:#fff;text-decoration:none;font-weight:800;font-size:16px}
.rowb{display:flex;gap:6px;flex-wrap:wrap}
.rowb .ib{flex:1}

/* sheets / dialogs */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:22px 22px 0 0;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.sheet.on{transform:none}
.sheet:not(.on){pointer-events:none}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:17px;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.sh-b{overflow:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}

/* picture picker */
.pp1{display:flex;gap:12px;align-items:center}
.ppv{width:96px;height:96px;border-radius:16px;border:1px solid var(--line);display:grid;place-items:center;font-size:64px;font-family:var(--emo);overflow:hidden;flex:none;background:var(--s2)}
.ppv img{width:100%;height:100%;object-fit:contain;background:#fff}
.ppw{font-family:var(--kid);font-size:24px;font-weight:700}
.pps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.pps button{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:30px;font-family:var(--emo);padding:0}
.pps button:hover,.pps button.on{border-color:var(--p);background:var(--mint2)}
.srch{display:flex;gap:6px}
.srch input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 button,.big3 label{height:72px;border-radius:14px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:13px;cursor:pointer}
.big3 .e{font-size:26px;font-family:var(--emo);line-height:1}
.big3 button:hover,.big3 label:hover{border-color:var(--p);background:var(--mint2)}
.styles{display:flex;gap:6px;flex-wrap:wrap}
.aibox{border:1px solid #c4b5fd;background:#faf8ff;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.aibox textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:64px;resize:vertical}
.keywarn{background:#fff7e6;border:1px solid #fcd34d;color:#92400e;border-radius:12px;padding:8px 10px;font-size:13.5px}
.keywarn button{border:0;background:none;color:var(--p7);font-weight:800;text-decoration:underline;padding:0}
.prog{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);width:0;transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.newopt{display:grid;grid-template-columns:1fr;gap:8px}
.newopt button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:12px}
.newopt button:hover{border-color:var(--p);background:var(--mint2)}
.newopt .e{font-size:30px;font-family:var(--emo);flex:none;width:40px;text-align:center}
.newopt b{display:block}
.newopt small{color:var(--muted)}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.iconpick button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:24px;font-family:var(--emo);padding:0}
.iconpick button.on{border-color:var(--p7);background:var(--mint)}

/* ---------- bigger screens (small-first) ---------- */
@container main (min-width:640px){
 .wh{display:grid;grid-template-columns:64px minmax(120px,1.2fr) minmax(110px,1fr) minmax(110px,1.1fr) 84px;gap:8px;padding:0 8px;color:var(--muted);font-size:12.5px;font-weight:700}
 .wr{grid-template-columns:64px minmax(120px,1.2fr) minmax(110px,1fr) minmax(110px,1.1fr) 84px}
 .f,.f2{display:contents}
 .fx{height:40px}
 .fx .fi{height:38px;font-size:15px}
 .acs{flex-direction:row}
 .pvr{grid-template-columns:28px 1.3fr 1fr 38px}
 .pane{padding:6px 16px 12px}
 .tools{padding:12px 16px 4px}
 .addbar{padding-left:16px;padding-right:16px}
}
@media (min-width:600px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .sheet{left:50%;right:auto;bottom:50%;width:min(560px,calc(100% - 32px));border-radius:22px;transform:translate(-50%,60%);opacity:0;transition:transform .2s,opacity .2s;max-height:min(86dvh,760px)}
 .sheet.on{transform:translate(-50%,50%);opacity:1}
 .grab{display:none}
 .newopt{grid-template-columns:1fr 1fr}
 .wst{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1024px){
 .side{display:block;width:320px;flex:none;border-right:1px solid var(--line);background:var(--paper);padding:14px;position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--top) - env(safe-area-inset-top,0px));overflow:auto}
 .wst{grid-template-columns:repeat(3,1fr)}
 .onlyS{display:none!important}

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let toastT;function toast(m,ms){const t=$('toast');t.innerHTML=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2600)}

/* ---------- languages ---------- */
const LANGS=[['en','🇬🇧','English','en-GB'],['th','🇹🇭','ไทย','th-TH'],['zh','🇨🇳','中文','zh-CN'],['ja','🇯🇵','日本語','ja-JP'],['ko','🇰🇷','한국어','ko-KR'],['vi','🇻🇳','Tiếng Việt','vi-VN'],['id','🇮🇩','Indonesia','id-ID'],['ms','🇲🇾','Melayu','ms-MY'],['my','🇲🇲','မြန်မာ','my-MM'],['lo','🇱🇦','ລາວ','lo-LA'],['km','🇰🇭','ខ្មែរ','km-KH'],['fil','🇵🇭','Filipino','fil-PH'],['hi','🇮🇳','हिन्दी','hi-IN'],['ar','🇸🇦','العربية','ar-SA'],['es','🇪🇸','Español','es-ES'],['fr','🇫🇷','Français','fr-FR'],['de','🇩🇪','Deutsch','de-DE'],['pt','🇧🇷','Português','pt-BR'],['ru','🇷🇺','Русский','ru-RU']];
const LG=c=>LANGS.find(l=>l[0]===c)||LANGS[0];

/* ---------- worksheet types (same codes as the worksheet page) ---------- */
const WT=[['L1','Hear & Pick','w'],['L2','Hear & Find','w'],['L3','Listen & Build','s'],['S1','Say It','w'],['S2','Talk Back','d'],['S3','Read Aloud','s'],['R1','Name It','w'],['R2','Find It','w'],['R3','Match Up','w'],['R4','Best Reply','d'],['R5','Word Order','s'],['R6','Fill the Blank','s'],['R7','Picture Story','t'],['R8','Word Search','w'],['W1','Spell It','w'],['W2','Fill It','w'],['W3','Listen & Type','s'],['W4','My Sentence','w'],['W5','Trace It','w'],['X','Custom','w']];
const SKC={L:'#c2410c',S:'#7c3aed',R:'#1d4ed8',W:'#be123c',X:'#6d28d9'};

/* ---------- settings (this device) ---------- */
const CFG_K='bokogo.vset.cfg';
let CFG={key:'',tm:'gemini-3.5-flash',im:'gemini-3.1-flash-image',sty:'cute',lang:'en',mt:'th'};
try{Object.assign(CFG,JSON.parse(localStorage.getItem(CFG_K)||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem(CFG_K,JSON.stringify(CFG))}catch(e){}};
const STY=[['cute','🧸 Cute','cute kawaii cartoon sticker, thick clean outline, soft colours'],['flat','🔷 Flat icon','simple flat vector icon, bold shapes, few colours'],['real','📷 Real','realistic photo of a single object, studio light'],['water','🎨 Watercolor','soft watercolor children\'s book illustration'],['clay','🧱 Clay 3D','cute 3D clay render, soft light'],['line','✏️ Line art','black line drawing for colouring, no fill']];

/* ---------- state ---------- */
let SETS=[],SET=null,TAB='w',saveT=null,PICK=-1;
function saveUI(st){const b=$('saveB'),l=$('saveL');if(!b)return;b.classList.toggle('saved',st==='saved');b.classList.toggle('pri',st!=='saved');l.textContent=st==='saved'?'Saved':st==='saving'?'Saving…':'Save';b.title=st==='saved'?(VS.cloud.on()?'Saved online':'Saved on this device'):'Save'}
const save=(now)=>{if(!SET)return;clearTimeout(saveT);saveUI('dirty');const go=()=>{saveT=null;return VS.put(SET).then(()=>{if(!VS.cloud.on())saveUI('saved')}).catch(e=>toast('⚠️ Save failed: '+esc(e.message)))};if(now)return go();saveT=setTimeout(go,400)};
async function saveNow(){if(!SET)return;saveUI('saving');await save(true);if(!VS.cloud.on()){saveUI('saved');toast('💾 Saved on this device. ☁️ Sign in to save online.');return}
 try{await VS.cloud.sync();saveUI('saved');toast('💾 Saved online')}catch(e){saveUI('dirty');toast('⚠️ Not saved online yet: '+esc(e.message)+'. It is safe on this device and will retry.')}}

/* ---------- images ---------- */
function fileToData(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
function shrink(src,max=384){return new Promise((ok)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let d=c.toDataURL('image/webp',.86);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/png');ok(d)};im.onerror=()=>ok(src);im.src=src})}
const picHTML=(w,cls)=>w.img?`<img src="${w.img}" alt="">`:w.e?esc(w.e):`<span class="add">＋🖼️</span>`;

/* ---------- speech ---------- */
function speak(t,lang){if(!t||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),l=LG(lang||SET?.lang||'en')[3];u.lang=l;u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(l.slice(0,2).toLowerCase()));if(v)u.voice=v;speechSynthesis.speak(u)}

/* ---------- free look-ups (no key) ---------- */
async function dictIPA(w){try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.toLowerCase()));if(!r.ok)return'';const j=await r.json();const ps=(j||[]).flatMap(e=>[e.phonetic,...(e.phonetics||[]).map(p=>p.text)]).filter(Boolean);const uk=(j||[]).flatMap(e=>(e.phonetics||[]).filter(p=>/-uk\./.test(p.audio||'')&&p.text).map(p=>p.text));return String(uk[0]||ps[0]||'').replace(/^[\/\[]|[\/\]]$/g,'')}catch(e){return''}}
/* IPA for any entry: whole entry → each word of a phrase → compound split (barber+shop) */
const IPAC=new Map();
const ABC={a:'eɪ',b:'biː',c:'siː',d:'diː',e:'iː',f:'ef',g:'dʒiː',h:'eɪtʃ',i:'aɪ',j:'dʒeɪ',k:'keɪ',l:'el',m:'em',n:'en',o:'əʊ',p:'piː',q:'kjuː',r:'ɑː',s:'es',t:'tiː',u:'juː',v:'viː',w:'ˈdʌb.əl.juː',x:'eks',y:'waɪ',z:'zed'};
async function freeIPA(w){const o=String(w||'').trim();if(/^[A-Z]{2,4}$/.test(o)){const L=[...o.toLowerCase()].map(c=>ABC[c]);return L.slice(0,-1).map(x=>'ˌ'+x).join('')+'ˈ'+L[L.length-1]} // TV, DVD, ATM: say the letters
 w=o.toLowerCase();if(!w)return'';if(IPAC.has(w))return IPAC.get(w);let r=await dictIPA(w);
 if(!r){const parts=o.split(/[\s\-–]+/).filter(Boolean);
  if(parts.length>1){const ps=[];for(const p of parts){const x=await freeIPA(p);if(!x){ps.length=0;break}ps.push(x)}r=ps.join(' ')}
  else if(/^[a-z]{6,16}$/.test(w)){const cut=[];for(let k=3;k<=w.length-3;k++)cut.push(k);cut.sort((a,b)=>Math.abs(a-w.length/2)-Math.abs(b-w.length/2));
   for(const k of cut){const a=await dictIPA(w.slice(0,k));if(!a)continue;const b=await dictIPA(w.slice(k));if(b){r=a+b.replace(/^ˈ/,'ˌ');break}}}}
 IPAC.set(w,r);return r}
async function freeTr(t,from,to){try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair='+from+'|'+to);if(!r.ok)return'';const j=await r.json();const s=j?.responseData?.translatedText||'';return /MYMEMORY|QUERY LENGTH/i.test(s)?'':s}catch(e){return''}}

/* ---------- Gemini (key stays on this device; called straight from the browser) ---------- */
const hasKey=()=>!!(CFG.key||'').trim();
/* Google retires models often ("no longer available to new users") or they get busy (503) → try the next one, remember the one that works */
const GEM_TXT=['gemini-3.5-flash','gemini-3-flash-preview','gemini-flash-latest','gemini-3.8-flash','gemini-flash-lite-latest'],GEM_IMG=['gemini-3.1-flash-image','gemini-3.1-flash-image-preview','gemini-3-pro-image','gemini-2.5-flash-image'];
async function gem(model,body){const img=model===CFG.im,list=[...new Set([model,...(img?GEM_IMG:GEM_TXT)])];let last,gone=false;
 for(const m of list){const ac=new AbortController(),tid=setTimeout(()=>ac.abort(),50000);let r,j;try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','x-goog-api-key':CFG.key.trim()},body:JSON.stringify(body)});j=await r.json().catch(()=>({}))}catch(e){clearTimeout(tid);last=new Error(e.name==='AbortError'?m+' took too long':e.message);continue}clearTimeout(tid);
  if(r.ok){if(m!==model&&gone){CFG[img?'im':'tm']=m;saveCfg()}return j}
  const msg=j?.error?.message||('HTTP '+r.status);last=new Error(msg);
  if(r.status===404||/no longer available|not found|not supported/i.test(msg)){if(m===model)gone=true;continue}
  if(r.status===503||r.status===429||r.status===500||/high demand|overloaded|quota/i.test(msg))continue;
  throw last}
 throw last}
async function gemJSON(prompt){const j=await gem(CFG.tm,{contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:.4}});const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');return JSON.parse(t.replace(/^```json|```$/g,''))}
async function gemText(prompt){const j=await gem(CFG.tm,{contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.7}});return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/^```\w*\n?|```$/g,'').trim()}
async function gemImage(word,sty){const st=(STY.find(s=>s[0]===sty)||STY[0])[2];const j=await gem(CFG.im,{contents:[{parts:[{text:`Draw ONE picture of "${word}" for a children's English vocabulary card. Style: ${st}. Plain white background, the object centred and filling most of the square, no text, no letters, no words, no border.`}]}],generationConfig:{responseModalities:['IMAGE','TEXT']}});const p=(j.candidates?.[0]?.content?.parts||[]).find(p=>p.inlineData||p.inline_data);if(!p)throw new Error('No picture came back');const d=p.inlineData||p.inline_data;return shrink(`data:${d.mimeType||d.mime_type||'image/png'};base64,${d.data}`)}
const keyWarn=()=>`<div class="keywarn">✨ AI needs a Gemini API key (free at Google AI Studio). <button data-a="settings">⚙️ Add key</button></div>`;

/* =================== LIBRARY =================== */
async function showLib(){SET=null;$('vEd').hidden=true;$('vLib').hidden=false;document.title='Bokogo Vocab Sets';history.replaceState(null,'',location.pathname);SETS=await VS.all();renderLib()}
function counts(s){return{w:s.words.length,s:VS.lines(s.sen).length,d:VS.lines(s.dlg).length,t:STO.count(s)}}
let LTAB='my',ALL=[],allT=null;
function libTabs(){$('ltMy').classList.toggle('on',LTAB==='my');$('ltAll').classList.toggle('on',LTAB==='all');$('allqw').hidden=LTAB!=='all';$('libh').textContent=LTAB==='all'?'All vocab sets':'My vocab sets';document.querySelector('#vLib .fab').hidden=LTAB==='all'}
async function loadAll(){const g=$('grid');libTabs();if(!VS.cloud.on()){$('libn').textContent='';g.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">🌐📚</div><h2 style="margin:0">Every teacher's vocab sets</h2><p>Sign in to see the sets all teachers saved online, then copy one into your sets.</p><button class="ib pri" data-a="cloud">☁️ Sign in</button></div>`;return}
 if(!ALL.length)g.innerHTML='<p class="muted" style="grid-column:1/-1">⏳ Loading…</p>';
 try{ALL=(await VS.cloud.all(($('allq').value||'').trim())).sets||[]}catch(e){g.innerHTML=`<p style="grid-column:1/-1">⚠️ ${esc(e.message)}</p>`;return}
 if(LTAB==='all')renderAll()}

function addWords(list,silent){const have=new Set(SET.words.map(w=>w.w.toLowerCase()));let n=0,skip=0;const first=SET.words.length;

 if(rows[rows.length-1]&&n)rows[rows.length-1].scrollIntoView({block:'nearest',behavior:'smooth'});

let filling=false;
async function autoFill(ws,quiet){if(filling)return;ws=ws||SET.words;const need=ws.filter(w=>!w.ipa||!w.m||!(w.img||w.e));if(!need.length){if(!quiet)toast('✅ Every word already has IPA, meaning and a picture');return}
 filling=true;const sid=SET.id;let done=0;
 try{
  if(hasKey()){if(!quiet)toast('✨ Asking AI…',8000);
   for(let s=0;s<need.length;s+=60){const part=need.slice(s,s+60);
    const out=await gemJSON(`You help English teachers. For each ${LG(SET.lang)[2]} word below give: "ipa" (British IPA, no slashes, with stress marks and syllable dots like ˈæp.əl), "m" (short meaning in ${LG(SET.mt)[2]}, 1–3 words, the everyday sense), "e" (ONE emoji that best pictures it, or "" if none fits). Topic of the set: "${SET.name}". Return JSON array of {"w","ipa","m","e"} in the same order.\nWords:\n${part.map(w=>w.w).join('\n')}`);
    (Array.isArray(out)?out:out.words||[]).forEach((o,i)=>{const w=part.find(x=>x.w.toLowerCase()===String(o.w||'').toLowerCase())||part[i];if(!w)return;if(!w.ipa&&o.ipa)w.ipa=String(o.ipa).replace(/^\/|\/$/g,'');if(!w.m&&o.m)w.m=o.m;if(!w.img&&!w.e&&o.e)w.e=o.e})}
   if(SET.lang==='en')for(const w of need){if(SET?.id!==sid)break;if(!w.ipa)w.ipa=await freeIPA(w.w)}
  }else{
   if(!quiet)toast('🔎 Looking up IPA and meanings…',8000);
   for(const w of need){if(SET?.id!==sid)break;if(!w.e&&!w.img)w.e=emoFor(w.w);
    if(!w.ipa&&SET.lang==='en')w.ipa=await freeIPA(w.w);
    if(!w.m&&SET.mt!==SET.lang)w.m=await freeTr(w.w,SET.lang,SET.mt);
    done++;if(SET?.id===sid&&TAB==='w'&&!document.activeElement?.closest?.('.wr')){renderPane()}}
  }
  if(SET?.id===sid){save();if(!document.activeElement?.closest?.('.wr'))renderEd()}
  const miss=need.filter(w=>!w.ipa||!w.m).length;toast(miss?`✅ Filled · ${miss} word${miss>1?'s':''} still need IPA or meaning (type them in)`:'✅ IPA, meaning and pictures filled');
 }catch(e){toast('⚠️ '+esc(e.message),5000)}finally{filling=false}}

/* 🔤 Check IPA (Nana 24 Nov): find words with no IPA and fill only those; nothing else is touched */
async function fillIPA(){if(filling)return;const sid=SET.id,need=SET.words.filter(w=>w.w&&!String(w.ipa||'').trim());
 if(!need.length){toast('✅ Every word has IPA');return}
 filling=true;toast(`🔤 ${need.length} word${need.length>1?'s':''} without IPA · looking up…`,8000);
 try{
  if(SET.lang==='en')for(const w of need){if(SET?.id!==sid)break;w.ipa=await freeIPA(w.w)}
  const left=need.filter(w=>!w.ipa);
  if(left.length&&hasKey()&&SET?.id===sid){try{const out=await gemJSON(`Give the British IPA (no slashes, with stress marks and syllable dots like ˈæp.əl) for each ${LG(SET.lang)[2]} word or phrase below. Return a JSON array of {"w","ipa"} in the same order.\nWords:\n${left.map(w=>w.w).join('\n')}`);
   (Array.isArray(out)?out:out.words||[]).forEach((o,i)=>{const w=left.find(x=>x.w.toLowerCase()===String(o.w||'').toLowerCase())||left[i];if(w&&!w.ipa&&o.ipa)w.ipa=String(o.ipa).replace(/^\/|\/$/g,'').trim()})}catch(e){}}
  if(SET?.id===sid){save();renderEd()}
  const still=need.filter(w=>!w.ipa),got=need.length-still.length;
  toast(still.length?`🔤 Filled ${got} · still missing: ${still.slice(0,6).map(w=>esc(w.w)).join(', ')}${still.length>6?'…':''} (type them in${hasKey()?'':' or add a Gemini key in ⚙️'})`:`✅ IPA filled for ${got} word${got>1?'s':''}`,still.length?7000:3500);
 }catch(e){toast('⚠️ '+esc(e.message),5000)}finally{filling=false}}

/* ✨ Tricky wrong answers (Nana 24 Nov): for Talk lines with no wrongs, AI writes 2 near-misses about the SAME subject */
async function aiWrongs(btn){if(!hasKey()){settingsSheet();toast('Add a Gemini key first · without one the worksheet still makes a grammar slip + a wrong-type reply');return}
 const L=VS.lines(SET.dlg),D=L.map(VS.dlgParse),need=D.map((d,i)=>[d,i]).filter(([d])=>d.q&&d.a&&!d.wr.length);if(!need.length){toast('✅ Every dialogue already has wrong answers');return}
 const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='⏳ Making…';
 try{const out=await gemJSON(`Act as an expert ESL/EFL assessment designer.
Focus on the vocabulary theme: ${SET.name}.
Target vocabulary list: ${wordList()}.

For each item below (question + correct answer), write wrong1 and wrong2.
Strict Rules for Quality Distractors:
1. NO grammar errors. Every choice must be 100% grammatically correct so students cannot guess the answer using grammar clues.
2. Same Topic & Structure: wrong1 and wrong2 must answer the same Wh-question type and use the same sentence structure and length as the correct Answer.
3. Semantic Mismatch Only: use other vocabulary words from the same theme (Lexical Set) to create a factual mismatch (wrong location, wrong action, wrong tool, or wrong role).
4. Plausible & Clear: natural English sentences, clearly false in real-world meaning, but realistic enough to test true vocabulary comprehension.
Return a JSON array of {"i","fact","trap"} with the same i, where fact = wrong1 and trap = wrong2.
${need.map(([d,i])=>JSON.stringify({i,q:d.q,a:d.a})).join('\n')}`);
  let n=0;(Array.isArray(out)?out:out.items||[]).forEach(o=>{const i=+o.i;const d=D[i];if(!d||d.wr.length)return;const w=[o.fact,o.trap].map(x=>String(x||'').replace(/\|/g,'/').trim()).filter(Boolean);if(w.length){d.wr=w;n++}});
  SET.dlg=D.map(d=>[d.q,d.a,...d.wr].join(' | ')).join('\n');save(true);renderEd();toast(`✨ Wrong answers added to ${n} dialogue${n===1?'':'s'}`)}
 catch(e){toast('⚠️ '+esc(e.message),5000)}finally{btn.disabled=false;btn.innerHTML=old}}

/* picture from file names */
async function addPicFiles(files){files=[...files].filter(f=>/^image\//.test(f.type));if(!files.length)return;let hit=0,add=0;

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function exportSet(s){dl(new Blob([JSON.stringify({format:VS.FORMAT,v:1,set:s})],{type:'application/json'}),fname(s.name)+'.vocab.json')}

async function inflate(raw){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(raw);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(buf),dec=new TextDecoder();let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Not a ZIP file');
 const n=dv.getUint16(e+10,true),out={};let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;if(name.endsWith('/'))continue;const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.subarray(ds,ds+csz);out[name]=meth===0?raw:await inflate(raw)}return out}
const mime=e=>({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',svg:'image/svg+xml'}[e]||'image/png');
const u8url=(u,p)=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return'data:'+mime(p.split('.').pop().toLowerCase())+';base64,'+btoa(s)};

async function fromBingo(d,files){const ol=d.ol||'en',learn=CFG.lang||'en',mt=CFG.mt||'th';const s=VS.blank(d.name||'Bingo');s.lang=learn;s.mt=mt;s.from='bingo:'+d.id;
 for(const it of d.items||[]){const o=it.o??it.w??'';const t=it.t||{};const w=ol===learn?o:(t[learn]||o);const m=ol===mt?o:(t[mt]||'');let img=it.el;
  if(img&&typeof img==='string'&&!img.startsWith('data:')){img=files&&files[img]?u8url(files[img],img):''}
  if(img&&img.startsWith('data:'))img=await shrink(img);else if(!/^https:\/\//.test(img||''))img='';
  if(w)s.words.push({id:VS.uid(),w:String(w).trim(),ipa:'',m:m,e:it.e||(img?'':emoFor(w)),img})}
 s.icon=(s.words.find(w=>w.e)||{}).e||'🎲';return s}
async function importFiles(fl){let added=0;
 for(const f of fl){try{let o,files=null;
  if(/\.zip$/i.test(f.name)||/zip/.test(f.type||'')){files=await unzip(await f.arrayBuffer());const bj=files['backup.json'];if(!bj)throw new Error('backup.json not found in the ZIP');o=JSON.parse(new TextDecoder().decode(bj))}
  else o=JSON.parse(await f.text());
  let list=[];
  if(o.format===VS.FORMAT){list=o.sets||[o.set]}
  else if(o.app==='learn8-bingo'||Array.isArray(o.projects)||(Array.isArray(o)&&o[0]&&o[0].items)){const pr=o.projects||o;toast(`🎲 Converting ${pr.length} Bingo games…`,6000);for(const d of pr)if(d&&Array.isArray(d.items))list.push(await fromBingo(d,files))}
  else if(o.words&&o.name)list=[o];
  else throw new Error('Unknown file');
  const have=await VS.all();
  for(const s of list){if(!s)continue;const same=have.find(x=>x.id===s.id||(s.from&&x.from===s.from));if(same&&(same.updated||0)>=(s.updated||0)&&!s.from)continue;if(same&&s.from)s.id=same.id;if(!s.id)s.id=VS.uid();s.updated=0;await VS.put(s);added++}
 }catch(e){toast('⚠️ '+esc(f.name)+': '+esc(e.message),5000)}}
 if(added){toast(`⬆️ ${added} set${added>1?'s':''} imported`);closeSheet();await showLib()}}

function cloudUI(d){const c=VS.cloud,st=d?d.state:(c.on()?'on':'off');['cloudD','cloudD2'].forEach(i=>{const x=$(i);if(x)x.className='cdot '+(c.on()?st:'')});
 const l=$('cloudL');if(l)l.textContent=c.on()?(c.st.name||'Online'):'Sign in';const b=$('cloudB');if(b)b.title=c.on()?'Saved online as '+(c.st.name||''):'Save online'}
/* mother tongues open now (more later: each one is turned on here) */
const MOTHER_ON=['th','en'];
const langOpts=sel=>LANGS.map(l=>`<option value="${l[0]}" ${MOTHER_ON.includes(l[0])?'':'disabled'} ${sel===l[0]?'selected':''}>${l[2]}${MOTHER_ON.includes(l[0])?'':' · soon'}</option>`).join('');
function cloudSheet(m){const c=VS.cloud;
 if(c.on()){const st=c.state,lab={on:'✅ Saved online',busy:'🔄 Saving…',err:'⚠️ Could not reach the server',offline:'📴 Offline. Will save when back online'}[st]||'✅ Saved online';
  sheet('☁️ Online saving',`<div class="cl-st"><span style="font-size:28px">👤</span><div style="flex:1;min-width:0"><b>${esc(c.st.name||'')}</b><span class="muted">${lab}</span></div></div>
  <div class="two"><div class="fld"><label>🗣️ My language</label><select data-pref="mother">${langOpts(c.st.mother||'th')}</select></div><div class="fld"><label>🎯 I am learning</label><select data-pref="learning">${LANGS.map(l=>`<option value="${l[0]}" ${l[0]==='en'?'':'disabled'} ${(c.st.learning||'en')===l[0]?'selected':''}>${l[2]}${l[0]==='en'?'':' · soon'}</option>`).join('')}</select></div></div>
  <p class="hint">Your sets and pictures are saved at <b>english.learn8.co</b>. Sign in with the same name on any phone, tablet or computer to see them.</p>
  <div class="rowb"><button class="ib pri" data-a="cl-sync">🔄 Sync now</button><button class="ib" data-a="cl-out">🚪 Sign out</button></div>`);return}
 const nw=m==='new';
 sheet('☁️ Save online',`<div class="cl-tabs"><button class="ib ${nw?'':'on'}" data-a="cl-in">🔑 Sign in</button><button class="ib ${nw?'on':''}" data-a="cl-new">✨ New account</button></div>
 <form id="clf" autocomplete="on" onsubmit="return false">
 <div class="fld"><label>👤 Name</label><input id="cln" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. teacher.nana"></div>
 <div class="fld"><label>🔒 Password</label><input id="clp" type="password" autocomplete="${nw?'new-password':'current-password'}" placeholder="${nw?'At least 8 characters':''}"></div>
 ${nw?`<div class="two"><div class="fld"><label>🗣️ My language</label><select id="clm">${langOpts(CFG.mt||'th')}</select></div><div class="fld"><label>🎯 I am learning</label><select id="cll"><option value="en" selected>English</option>${LANGS.filter(l=>l[0]!=='en').map(l=>`<option value="${l[0]}" disabled>${l[2]} · soon</option>`).join('')}</select></div></div>
 <p class="hint" style="margin:-4px 0 0">Used for meanings and translations. You can change it later.</p>
 <div class="fld"><label>🎟️ Invite code</label><input id="cli" autocapitalize="none" spellcheck="false" autocomplete="off"></div>`:''}
 <div class="rowb"><button class="ib pri" type="submit" data-a="cl-go" data-m="${nw?'new':'in'}">${nw?'✨ Create account':'🔑 Sign in'}</button></div></form>
 <p class="hint">Sets on this device are uploaded after you sign in, then kept in sync. Without signing in, sets stay only in this browser.</p>`);setTimeout(()=>{const x=$('cln');if(x)x.focus()},50)}
async function cloudGo(m){const n=($('cln').value||'').trim(),p=$('clp').value||'';if(!n||!p){toast('Type your name and password');return}
 const b=document.querySelector('[data-a="cl-go"]');if(b){b.disabled=true;b.textContent='⏳ …'}
 try{if(m==='new'){const mo=$('clm').value||'th';await VS.cloud.register(n,p,($('cli').value||'').trim(),mo,$('cll').value||'en');CFG.mt=mo;saveCfg()}else{await VS.cloud.signin(n,p);if(VS.cloud.st.mother){CFG.mt=VS.cloud.st.mother;saveCfg()}}closeSheet();toast('☁️ Signed in as '+esc(VS.cloud.st.name)+'. Sets are saved online.')}
 catch(er){toast('⚠️ '+esc(er.message));if(b){b.disabled=false;b.textContent=m==='new'?'✨ Create account':'🔑 Sign in'}}}
addEventListener('vs-cloud',async e=>{const d=e.detail||{};cloudUI(d);if(d.synced&&SET&&!saveT)saveUI('saved');if(d.state==='on'&&!d.synced&&LTAB==='all'&&!$('vLib').hidden&&!ALL.length)loadAll();
 if(d.signedOut)toast('☁️ Please sign in again');
 if(d.pushed&&SET&&SET.id===d.pushed.id){const m=new Map((d.pushed.words||[]).map(w=>[w.id,w.img]));for(const w of SET.words){const u=m.get(w.id);if(u&&/^data:/.test(w.img||'')&&/^https:/.test(u))w.img=u}}
 if(d.changed){if(!$('vLib').hidden){SETS=await VS.all();renderLib()}
  else if(SET&&d.changed.includes(SET.id)&&!saveT){const s=await VS.get(SET.id);if(s){SET=s;['words','sen','dlg','sto'].forEach(k=>{if(SET[k]==null)SET[k]=k==='words'?[]:''});SET.ipa=SET.ipa||{};STO.prep(SET);if(!$('sheet').classList.contains('on'))renderEd()}else showLib()}}});
document.addEventListener('click',async e=>{const t=e.target;
 const op=t.closest('[data-open]');if(op&&!t.closest('a')){openSet(op.dataset.open);return}
 const cur=t.closest('[data-cur]');if(cur){VS.cur.set(cur.dataset.cur);return}
 const tb=t.closest('[data-tab]');if(tb){TAB=tb.dataset.tab;renderTabs();renderPane();return}
 const sy=t.closest('[data-say]');if(sy){speak(sy.dataset.say);return}
 const em=t.closest('[data-emo]');if(em){setPic({e:em.dataset.emo});document.querySelectorAll('#pps button').forEach(b=>b.classList.toggle('on',b===em));return}
 const ic=t.closest('[data-ico]');if(ic){SET.icon=ic.dataset.ico;save();renderEd();closeSheet();return}
 const sty=t.closest('[data-sty]');if(sty){CFG.sty=sty.dataset.sty;saveCfg();sty.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===sty));return}
 const b=t.closest('[data-a]');if(!b)return;const a=b.dataset.a;const row=b.closest('.wr');const i=row?+row.dataset.i:-1;
 switch(a){
  case 'close':closeSheet();break;
  case 'home':closeSheet();showLib();break;
  case 'new':newSheet();break;
  case 'demo':{const s=sample();await VS.put(s);openSet(s.id);break}
  case 'mk':{const s=VS.blank(($('nn').value||'').trim()||'New set');s.lang=CFG.lang;s.mt=(VS.cloud.on()&&VS.cloud.st.mother)||CFG.mt;await VS.put(s);closeSheet();await openSet(s.id);TAB='w';renderEd();const m=b.dataset.m;
   if(m==='paste')pasteSheet();else if(m==='ai')aiWordsSheet();else if(m==='pics')$('fImgs').click();else if(m==='cut')CUT.pick();else setTimeout(()=>$('addw').focus(),100);break}
  case 'settings':settingsSheet();break;
  case 'cloud':cloudSheet();break;
  case 'savenow':saveNow();break;
  case 'lt-my':LTAB='my';renderLib();break;
  case 'lt-all':LTAB='all';loadAll();break;
  case 'copyset':copyShared(+b.dataset.i);break;
  case 'openmine':{const x=ALL[+b.dataset.i];if(x){LTAB='my';openSet(x.id)}break}
  case 'cl-in':case 'cl-new':cloudSheet(a==='cl-new'?'new':'in');break;
  case 'cl-go':cloudGo(b.dataset.m);break;
  case 'cl-sync':VS.cloud.sync().then(()=>{toast('☁️ Synced');cloudSheet()},er=>toast('⚠️ '+esc(er.message)));break;
  case 'cl-out':if(confirm('Sign out? Sets stay on this device too.')){await VS.cloud.signout();closeSheet();toast('Signed out')}break;
  case 'savecfg':CFG.key=$('sk').value.trim();CFG.tm=$('stm').value.trim()||CFG.tm;CFG.im=$('sim').value.trim()||CFG.im;CFG.lang=$('sl').value;CFG.mt=$('smt').value;saveCfg();toast('💾 Saved');closeSheet();if(SET)renderPane();break;
  case 'testkey':{CFG.key=$('sk').value.trim();CFG.tm=$('stm').value.trim()||CFG.tm;saveCfg();b.disabled=true;b.textContent='⏳';try{const r=await gemText('Reply with the single word: OK');toast('✅ Key works · '+esc(r.slice(0,20)))}catch(er){toast('⚠️ '+esc(er.message),5000)}b.disabled=false;b.textContent='🧪 Test key';break}
  case 'import':$('fImp').click();break;
  case 'backup':backupAll();break;
  case 'more':sheet(`<span class="emo">${esc(SET.icon)}</span> ${esc(SET.name)}`,sideHTML());break;
  case 'icon':iconSheet();break;
  case 'seticon':{const v=$('ic').value.trim();if(v){SET.icon=v;save();renderEd()}closeSheet();break}
  case 'export':exportSet(SET);break;
  case 'dup':{const s=JSON.parse(JSON.stringify(SET));s.id=VS.uid();s.name=SET.name+' (copy)';delete s.created;delete s.from;await VS.put(s);closeSheet();openSet(s.id);toast('⧉ Copied');break}
  case 'delset':if(confirm(`Delete "${SET.name}"? This cannot be undone.`)){await VS.del(SET.id);closeSheet();showLib();toast('🗑 Deleted')}break;
  case 'pic':openPick(i);break;
  case 'say':{const w=row?SET.words[i]:SET.words[PICK];if(w)speak(w.w);break}
  case 'delw':{const w=SET.words[i];SET.words.splice(i,1);save();renderEd();toast(`🗑 ${esc(w.w)} · <button style="background:none;border:0;color:#5eead4;font-weight:800" data-a="undo">Undo</button>`,5000);window._undo=[i,w];break}
  case 'undo':if(window._undo){SET.words.splice(window._undo[0],0,window._undo[1]);window._undo=null;save();renderEd()}break;
  case 'fill':autoFill(null,false);break;
  case 'fillipa':fillIPA();break;
  case 'paste':pasteSheet();break;
  case 'dopaste':{const l=parseLines($('pt').value);closeSheet();addWords(l);break}
  case 'pics':$('fImgs').click();break;
  case 'cutsheet':CUT.pick();break;
  case 'aiwords':aiWordsSheet();break;
  case 'doaiwords':{const pr=$('ap').value.trim();if(!pr)return;b.disabled=true;b.textContent='⏳ Making…';
   try{const out=await gemJSON(`Make a vocabulary list for English teachers. Request: "${pr}". Learning language: ${LG(SET.lang)[2]}. For each word give "w" (the word, lowercase unless a proper noun), "ipa" (British IPA, no slashes, stress marks and syllable dots), "m" (meaning in ${LG(SET.mt)[2]}, 1–3 words), "e" (ONE emoji that pictures it, or ""). Concrete, picturable words first. Return a JSON array of {"w","ipa","m","e"}.`);
    const l=(Array.isArray(out)?out:out.words||[]).map(o=>({w:String(o.w||'').trim(),ipa:String(o.ipa||'').replace(/^\/|\/$/g,''),m:o.m||'',e:o.e||''})).filter(x=>x.w);closeSheet();addWords(l,true);toast(`✨ ${l.length} words added`)}
   catch(er){toast('⚠️ '+esc(er.message),5000);b.disabled=false;b.textContent='✨ Make words'}break}
  case 'aipics':aiPics(b);break;
  case 'genone':{const w=SET.words[PICK];b.disabled=true;b.textContent='⏳ Drawing…';try{setPic({img:await gemImage(w.w,CFG.sty),ai:true})}catch(er){toast('⚠️ '+esc(er.message),5000)}b.disabled=false;b.textContent='✨ Make picture';break}
  case 'nopic':setPic({e:'',img:''});closeSheet();break;
  case 'pastepic':try{const it=await navigator.clipboard.read();for(const c of it){const ty=c.types.find(x=>x.startsWith('image/'));if(ty){const bl=await c.getType(ty);setPic({img:await shrink(await fileToData(bl))});return}}toast('No picture in the clipboard')}catch(er){toast('Copy a picture first, then press 📋 (or use Upload)')}break;
  case 'aisen':aiText('sen',b);break;case 'aidlg':aiText('dlg',b);break;case 'aiwrong':aiWrongs(b);break;case 'aisto':aiText('sto',b);break;
  case 'trsen':trSen(b);break;
  case 'ipasen':fetchSenIPA(false);break;
  default:if(a.startsWith('st-'))await STO.click(a,b);
 }});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('vcard')){e.preventDefault();openSet(e.target.dataset.open)}});
document.addEventListener('input',e=>{const t=e.target;if(!SET)return;if(STO.input(t))return;
 if(t.id==='edName'){SET.name=t.value;save();document.title=SET.name+' · Vocab Sets';return}
 const row=t.closest('.wr');if(row&&t.dataset.k){const w=SET.words[+row.dataset.i];w[t.dataset.k]=t.dataset.k==='ipa'?t.value.replace(/\//g,''):t.value;if(t.dataset.k!=='w')t.closest('.fx')?.classList.toggle('miss',!t.value);save();return}
 if(t.id==='ta'){SET[t.dataset.k]=t.value;save();clearTimeout(window._pvT);window._pvT=setTimeout(()=>{renderPv();renderTabs();renderSide()},250);return}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.pref){VS.cloud.prefs({[t.dataset.pref]:t.value}).then(()=>toast('🗣️ Saved'),er=>toast('⚠️ '+esc(er.message)));return}
 if(!SET)return;if(t.matches('[data-stbulk],[data-stup]')||t.dataset.a2){STO.change(t);return}
 if(t.dataset.f){SET[t.dataset.f]=t.value;save();renderEd();if($('sheet').classList.contains('on')&&$('shB').querySelector('[data-f]'))$('shB').innerHTML=sideHTML();return}
 const row=t.closest('.wr');if(row&&t.dataset.k==='w'){const w=SET.words[+row.dataset.i];if(!w.img&&(!w.e||w.e===emoFor(w._old||'')))w.e=emoFor(w.w)||w.e;if(w.w&&(!w.ipa||!w.m))autoFill([w],true);renderPane()}
 if(t.id==='ta'&&t.dataset.k==='sen')fetchSenIPA(true)});
document.addEventListener('focusin',e=>{const t=e.target;if(SET&&t.dataset?.k==='w'){const r=t.closest('.wr');if(r)SET.words[+r.dataset.i]._old=t.value}});
$('addf').onsubmit=e=>{e.preventDefault();const v=$('addw').value;if(!v.trim())return;addWords(parseLines(v));$('addw').value='';$('addw').focus()};
$('addw').addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(t&&/\n/.test(t.trim())){e.preventDefault();addWords(parseLines(t))}});
$('fImgs').onchange=e=>{if(SET)addPicFiles(e.target.files);e.target.value=''};
$('fImp').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
/* drag pictures onto the editor: onto one tile = that word, anywhere else = match by file name */
let dragN=0;
document.addEventListener('dragenter',e=>{if(SET&&TAB==='w'&&[...(e.dataTransfer?.types||[])].includes('Files')){dragN++;document.body.classList.add('dragging')}});
document.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('dragging')}});
document.addEventListener('dragover',e=>{if(SET&&[...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();const pk=e.target.closest?.('.pk');document.querySelectorAll('.pk.ov').forEach(x=>x!==pk&&x.classList.remove('ov'));if(pk)pk.classList.add('ov')}});
document.addEventListener('drop',async e=>{dragN=0;document.body.classList.remove('dragging');if(!SET||!e.dataTransfer?.files?.length)return;e.preventDefault();const pk=e.target.closest?.('.pk');document.querySelectorAll('.pk.ov').forEach(x=>x.classList.remove('ov'));
 if(TAB==='t'&&!pk&&await STO.drop(e.dataTransfer.files,e.target))return;
 if(pk&&e.dataTransfer.files.length===1){PICK=+pk.closest('.wr').dataset.i;setPic({img:await shrink(await fileToData(e.dataTransfer.files[0]))});PICK=-1;return}
 if(/\.(json|zip)$/i.test(e.dataTransfer.files[0].name))return importFiles([...e.dataTransfer.files]);addPicFiles(e.dataTransfer.files)});
document.addEventListener('paste',e=>{if(SET&&PICK<0)STO.paste(e)});
document.addEventListener('paste',async e=>{if(PICK<0)return;const f=[...(e.clipboardData?.files||[])].find(f=>/^image\//.test(f.type));if(f){e.preventDefault();setPic({img:await shrink(await fileToData(f))})}});

/* ---------- start ---------- */
window.VSE={get SET(){return SET},TAB:()=>TAB,save:n=>save(n),sheet,closeSheet,toast,esc,hiWords,LG,LANGS,hasKey,gemJSON,freeTr,speak,settingsSheet,renderTabs,renderSide,renderPane,fileToData};
cloudUI();
$('allq').addEventListener('input',()=>{clearTimeout(allT);allT=setTimeout(loadAll,300)});
(async()=>{const q=new URLSearchParams(location.search);try{if(q.get('set'))await openSet(q.get('set'));else await showLib();if(q.get('new'))newSheet()}catch(e){document.body.insertAdjacentHTML('afterbegin',`<p style="padding:16px;color:#b00">⚠️ This browser blocked local storage (${esc(e.message)}). Try a normal (not private) window.</p>`)}})();
window.addEventListener('pagehide',()=>{if(SET)save(true)});
})();
</script>
</body>
