; english.learn8.co · own PHP 8.3 pool (php8.3-fpm-sp had no other sites). Installed by server/setup.sh
[english]
user = serverpilot
group = serverpilot
listen = /srv/english/php.sock
listen.owner = serverpilot
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
php_admin_value[upload_max_filesize] = 40M
php_admin_value[post_max_size] = 40M
php_admin_value[memory_limit] = 256M
php_admin_value[open_basedir] = /srv/english/:/tmp/
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/english/logs/php.log
