# english.learn8.co · Bokogo (own site; learn8.co is not touched). Installed by server/setup.sh
server {
    listen       80;
    listen       [::]:80;
    server_name  english.learn8.co;
    location ^~ /.well-known/acme-challenge/ { root /srv/english/public; default_type text/plain; }
    #HTTP# include /etc/nginx-sp/english-body.inc;
    #SSL# location / { return 301 https://$host$request_uri; }
}
