@font-face{font-family:'BKDots';src:local('KG Primary Dots'),local('KGPrimaryDots'),local('KG Primary Dots Regular'),local('KGPrimaryDots-Regular')}
/* Layout: Games > Create & print. Small-first: chips + paper preview + settings sheet (phone) -> chips + preview | settings (iPad portrait) -> types | preview | settings (iPad landscape / desktop) */
:root{
 --p:#14b8a6;--p6:#0d9488;--p7:#0f766e;--mint:#ccfbf1;--mint2:#f0fdfa;
 --ink:#111827;--muted:#5f6b6a;--line:#dfe7e5;--bg:#eef3f2;--paper:#fff;--s2:#f6f9f8;
 --L:#c2410c;--Lb:#fff1dc;--S:#7c3aed;--Sb:#efe9ff;--R:#1d4ed8;--Rb:#e3edff;--W:#be123c;--Wb:#ffe4ec;--X:#6d28d9;--Xb:#f3eefe;
 --ui:'Sarabun',system-ui,sans-serif;--kid:'Andika','Sarabun',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e7efed;--muted:#9fb0ad;--line:#2c3a38;--bg:#0f1716;--paper:#16201f;--s2:#1c2826;--mint:#134e4a;--mint2:#122d2a;--Lb:#3a2414;--Sb:#2a1f45;--Rb:#18264a;--Wb:#3d1724;--Xb:#271c40;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e7efed;--muted:#9fb0ad;--line:#2c3a38;--bg:#0f1716;--paper:#16201f;--s2:#1c2826;--mint:#134e4a;--mint2:#122d2a;--Lb:#3a2414;--Sb:#2a1f45;--Rb:#18264a;--Wb:#3d1724;--Xb:#271c40;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.page{padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* mock bar */
.mk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.mk b{font-size:13px;color:var(--muted)}
.mk button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:5px 11px;font-weight:700;font-size:13.5px}
.mk button.on{background:var(--p7);border-color:var(--p7);color:#fff}
.mk .hint{font-size:13px;color:var(--muted)}
.fw{overflow:auto;max-width:100%}
.frame{container:frame/inline-size;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;width:100%;height:calc(100vh - 90px);min-height:560px}
.frame.dev{border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,#0d9488,#047857);color:#fff;flex:none}
.top .bk{border:0;background:rgba(255,255,255,.16);border-radius:10px;padding:5px 10px;font-weight:700;white-space:nowrap}
.top h1{font-size:17px;margin:0;white-space:nowrap}
.top .crumb{font-size:12.5px;opacity:.85;white-space:nowrap}
.top .tp{margin-left:auto;border:0;background:#fff;color:#0f766e;border-radius:99px;padding:5px 12px;font-weight:800;white-space:nowrap}
.top .pr{border:0;background:#FFD66B;color:#1F2433;border-radius:12px;padding:7px 14px;font-weight:800;white-space:nowrap;box-shadow:0 3px 0 #c99a1c}
.body{flex:1;min-height:0;display:flex}
/* type list (wide) */
.types{width:272px;flex:none;overflow:auto;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--s2)}
.grp{border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:7px;border:1.5px solid color-mix(in srgb,currentColor 22%,transparent)}
.grp h4{margin:4px 6px 2px;font-size:16px;display:flex;gap:6px;align-items:center}
.ty{display:flex;gap:10px;align-items:center;border:1.5px solid transparent;background:var(--paper);border-radius:14px;padding:9px 10px;text-align:left;box-shadow:0 1px 3px rgba(20,30,60,.08)}
.ty.on{border-color:currentColor;box-shadow:0 0 0 2px currentColor inset}
.ty .cd{flex:none;font-size:13px;font-weight:800;color:#fff;border-radius:9px;padding:4px 7px;min-width:34px;text-align:center}
.ty .tyt{flex:1;min-width:0;color:var(--ink);font-weight:700;font-size:16px;line-height:1.15;display:flex;flex-direction:column;gap:3px}
.ty .tyf{display:block;height:15px;line-height:0}.ty .tyf svg{height:15px;width:auto}
.ty .tyi{flex:none;width:36px;height:36px;display:grid;place-items:center;font-style:normal;font-size:24px}.ty .tyi svg{width:36px;height:36px}

.ty small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chips strip (narrow) */
.strip{display:none;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);flex:none;scrollbar-width:thin;background:var(--s2)}
.chip{flex:none;display:flex;gap:5px;align-items:center;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 10px 4px 5px;font-weight:700;font-size:13.5px;white-space:nowrap}
.chip .cd{font-size:11px;font-weight:800;color:#fff;border-radius:99px;padding:1px 6px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.sep{border:0;background:none;padding:0 2px;font-size:16px}
.chip .ci{flex:none;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal}.chip .ci svg{width:20px;height:20px}
/* preview */
.mid{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.ph .cd{font-size:12px;font-weight:800;color:#fff;border-radius:8px;padding:2px 8px}
.ph h2{font-size:17px;margin:0;font-family:var(--kid)}
.ph .how{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.ph .pc{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}
.prev{flex:1;min-height:0;overflow-x:auto;overflow-y:scroll;background:repeating-linear-gradient(45deg,var(--s2) 0 10px,var(--bg) 10px 20px);padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pl{align-self:stretch;display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:800;color:var(--muted);margin-top:6px}
.pl i{font-style:normal;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.box{flex:none;box-shadow:0 3px 12px rgba(0,0,0,.18);background:#fff}
/* settings */
.set{width:300px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.sh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.sh b{font-size:15px}.sh .x{display:none;margin-left:auto;border:0;background:var(--s2);border-radius:10px;width:34px;height:34px;font-size:18px}
.sb{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.note{border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.45}
.note b{display:block;font-size:13px;margin-bottom:2px}
.sec{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.ctl{display:flex;flex-direction:column;gap:5px}
.pset{flex:none;min-width:0;border:1.5px solid var(--line,#d6dde3);border-radius:14px;background:var(--s1,#fff);overflow:hidden}
.pset summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 12px;font-size:14px;min-height:44px;box-sizing:border-box}
.pset summary::-webkit-details-marker{display:none}
.pset summary::after{content:'▾';margin-left:6px;color:var(--muted);transition:transform .15s}
.pset[open] summary::after{transform:rotate(180deg)}
.pset .pn{font:700 11.5px var(--ui);background:var(--s2);border-radius:999px;padding:2px 8px;color:var(--muted)}
.pset .pk{margin-left:auto;font-size:12px;color:var(--muted)}
.pset .pb{display:flex;flex-direction:column;gap:14px;padding:4px 12px 14px;border-top:1px dashed var(--line,#d6dde3)}
.ctl textarea.tpl{width:100%;box-sizing:border-box;font:600 15px/1.55 var(--ui);border:1.5px solid var(--line,#d6dde3);border-radius:12px;padding:10px 12px;resize:vertical;min-height:150px;background:var(--s1,#fff);color:inherit}
.ctl textarea.tpl:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
.ctl .tah{color:var(--muted);font-size:12.5px;line-height:1.45}
.ctl label{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.ctl label .ic{width:22px;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.ovf{flex:none;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:999px;padding:3px 10px;font:700 12px var(--ui);white-space:nowrap}
.sl{display:flex;align-items:center;gap:8px}.sl .e{flex:none;line-height:1;opacity:.6;font-weight:800}.sl .e.a{font-size:13px}.sl .e.b{font-size:22px}
.sl input{flex:1;min-width:0;height:36px;accent-color:var(--p7);cursor:pointer}
.ctl label output{margin-left:auto;flex:none;min-width:52px;text-align:center;font:700 14px var(--ui);background:var(--s2);border-radius:8px;padding:4px 6px}
.sl button{flex:none;border:1px solid var(--line,#ccd);background:#fff;border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer}
.seg button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13.5px;min-width:42px}
.seg button.on{background:var(--p7);border-color:var(--p7);color:#fff}
svg.trw{overflow:visible}:has(>svg.trw){overflow:hidden}
.seg button[data-k="font"]{font-size:15px;min-width:86px}
.seg button[data-v="andika"]{font-family:Andika,sans-serif}.seg button[data-v="edu"]{font-family:'Edu SA Beginner',sans-serif}.seg button[data-v="playpen"]{font-family:'Playpen Sans',sans-serif}
.seg button[data-v="us"]{font-family:'Playwrite US Trad',cursive;font-size:13px}.seg button[data-v="gb"]{font-family:'Playwrite GB J',cursive;font-size:13px}.seg button[data-v="nz"]{font-family:'Playwrite NZ',cursive;font-size:13px}
.tg{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;text-align:left;font-weight:700;font-size:14px}
.tg .ic{width:22px;text-align:center}
.tg .sw{margin-left:auto;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg.on .sw{background:var(--p7)}.tg.on .sw::after{left:21px}
.tg small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.mix{display:flex;flex-wrap:wrap;gap:4px}
.mix button{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:3px 7px;font-weight:800;font-size:12.5px}
.mix button.on{color:#fff}
.sf{padding:10px 12px;border-top:1px solid var(--line);flex:none;display:flex;flex-direction:column;gap:6px}
.sf .sum{font-size:13px;color:var(--muted)}
.bigpr{border:0;background:var(--p7);color:#fff;border-radius:14px;padding:11px;font-weight:800;font-size:16px}
.bbar{display:none;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex:none;background:var(--paper)}
.bbar button{flex:1;border-radius:14px;padding:10px;font-weight:800;border:1.5px solid var(--line);background:var(--paper)}
.bbar .bp{background:var(--p7);border-color:var(--p7);color:#fff}
.scrim{display:none}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:9px 14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:30}
.toast.on{opacity:1}
.frame{position:relative}
/* responsive: frame container */
@container frame (max-width:999px){.types{display:none}.strip{display:flex}.set{width:270px}}
@container frame (max-width:699px){
 .set{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:78%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .25s;z-index:20}
 .set.open{transform:none}
 .sh .x{display:block}.sf{display:none}
 .scrim{display:block;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.open{opacity:1;pointer-events:auto}
 .bbar{display:flex}.top .pr,.top .crumb{display:none}.top h1{font-size:15px}.ph .how{display:none}.prev{padding:10px}
}
@container frame (max-width:420px){.top .tp{padding:4px 9px;font-size:13px}.ph h2{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== worksheet paper (always white, print colours) ===== */
.sheet{background:#fff;color:#111;font-family:var(--kid);position:relative;overflow:hidden;transform-origin:0 0;--pic:15mm;--pz:1;--tz:1;--iz:1;--fs:calc(13pt*var(--tz));--tk:max(.4,min(1,var(--tz)))}
.sheet .in{position:absolute;inset:0;padding:10mm 11mm 9mm;display:flex;flex-direction:column;gap:3.5mm}
.hd{display:flex;flex-direction:column;gap:2.5mm;flex:none}
.hd1{display:flex;align-items:center;gap:3mm}
.hd1 .cd{font:800 10pt var(--ui);color:#fff;border-radius:2mm;padding:.6mm 2.2mm}
.hd1 h3{margin:0;font-size:17pt;font-weight:700}
.hd1 .brand{margin-left:auto;font:800 9pt var(--ui);color:#0f766e;display:flex;align-items:center;gap:1.5mm}
.hd1 .brand i{font-style:normal;width:5mm;height:5mm;border-radius:1.4mm;background:#0f766e;color:#fff;display:grid;place-items:center;font-size:8pt}
.nm{display:flex;gap:4mm;font:600 10pt var(--ui);color:#333;align-items:flex-end}
.nm span{display:flex;gap:1.5mm;align-items:flex-end;flex:1}
.nm span::after{content:"";flex:1;border-bottom:.3mm solid #555;height:4mm}
.nm span.sc{flex:none;width:28mm}
.nm span.sc::after{display:none}
.nm span.sc em{font-style:normal;border:.35mm solid #555;border-radius:2mm;width:22mm;height:8mm;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 1.5mm .6mm;font-size:9pt}
.ins{display:flex;align-items:center;gap:2mm;font-size:11pt;border-radius:2.5mm;padding:1.6mm 3mm}
.ins b{font-size:14pt}.ins .ar{color:#888}
.ins .tx{margin-left:auto;font-size:10pt;color:#444}
.mini{display:flex;align-items:center;gap:2mm;font-size:10pt;color:#555;flex:none}
.mini .cd{font:800 8.5pt var(--ui);color:#fff;border-radius:1.6mm;padding:.3mm 1.6mm}
.ft{flex:none;display:flex;justify-content:space-between;font:600 8pt var(--ui);color:#999;border-top:.2mm solid #ddd;padding-top:1.5mm}
.items{flex:1;min-height:0;display:grid;gap:calc(3mm*var(--tk))}
.it{border:.3mm solid #cfd6d4;border-radius:3mm;padding:calc(2mm*var(--tk)) calc(3mm*var(--tk));display:flex;align-items:center;gap:calc(3mm*var(--tk));min-height:0;overflow:hidden;position:relative}
.no{flex:none;width:calc(7mm*var(--tk));height:calc(7mm*var(--tk));border-radius:50%;background:#111;color:#fff;font:800 calc(10pt*var(--tk)) var(--ui);display:grid;place-items:center;align-self:flex-start}
.pic{font-size:var(--pic);line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.snd{font-size:calc(13pt*var(--tk));flex:none}
.qr{flex:none;display:block}
.opts{flex:1;display:flex;gap:3mm;justify-content:space-around;align-items:center;min-width:0}
.op{display:flex;flex-direction:column;align-items:center;gap:1mm;border:0;border-radius:3mm;padding:1.5mm 2.5mm;position:relative}
.op i{font:800 calc(10pt*var(--tk)) var(--ui);font-style:normal;width:calc(6mm*var(--tk));height:calc(6mm*var(--tk));border:.35mm solid #444;border-radius:50%;display:grid;place-items:center}
.kst{margin-left:auto;background:#e11d48;color:#fff;font:800 10pt var(--ui);border-radius:2mm;padding:1mm 3mm;white-space:nowrap}
.sheet.key .in{box-shadow:inset 0 0 0 .8mm #fecdd3}
.ans{color:#e11d48!important;font-weight:800}
.ok{outline:.8mm solid #e11d48;outline-offset:.5mm;border-radius:3mm}
.op.ok i{background:#e11d48;color:#fff;border-color:#e11d48}
.op.sd{flex-direction:row;gap:calc(1.5mm*var(--tk));padding:calc(.5mm*var(--tk)) calc(1.5mm*var(--tk))}
.op.sd i{flex:none}
.sndc{flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(1mm*var(--tk))}
.wd{font-size:var(--fs);font-weight:700}
.ipa{font:400 calc(9.5pt*var(--iz,1)) 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#555}.ipa.ans,.ipa b{font-weight:400;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.line{flex:1;border-bottom:.35mm solid #555;height:8mm;min-width:20mm}
.hw{flex:1;min-width:0;background:linear-gradient(#999,#999) 0 0/100% .25mm no-repeat,repeating-linear-gradient(90deg,#aaa 0 1.5mm,transparent 1.5mm 3mm) 0 40%/100% .25mm no-repeat,linear-gradient(#d33,#d33) 0 75%/100% .35mm no-repeat,linear-gradient(#bbb,#bbb) 0 100%/100% .25mm no-repeat}
.hw1{background:linear-gradient(#555,#555) 0 100%/100% .35mm no-repeat}
.tile{border:.35mm solid #333;border-radius:2mm;padding:calc(1mm*var(--tk)) calc(2.5mm*var(--tk));font-size:var(--fs);font-weight:700;background:#fff;display:inline-flex;flex-direction:column;align-items:center;gap:.6mm}
.tile.cut{border-style:dashed}
.tile em{font-style:normal;width:calc(6mm*var(--tk));height:calc(5mm*var(--tk));border:.3mm solid #888;border-radius:1mm;font:700 calc(9pt*var(--tk)) var(--ui);display:grid;place-items:center;color:#e11d48}
.tiles{display:flex;flex-wrap:wrap;gap:calc(2mm*var(--tk));align-items:center}
/* IPA under words (Nana 25 Nov) */
.wipw{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.15}.ipa.wip{display:block;font-weight:400;line-height:1.1;white-space:nowrap}.wips{display:inline-flex;flex-wrap:wrap;gap:.8mm 1.8mm;align-items:flex-start;vertical-align:top}
.lb{display:inline-grid;place-items:center;width:calc(8mm*var(--tz));height:calc(9mm*var(--tz));border:.35mm solid #444;border-radius:1.5mm;font-size:calc(14pt*var(--tz));font-weight:700;margin-right:1mm}
.lb.g{background:#f1f1f1;border-color:#aaa}
.lb.k{color:#e11d48}
.bank{font-size:calc(1pt*var(--tz));display:flex;flex-wrap:wrap;gap:1.2mm;justify-content:center;max-width:95%}.bank i{font:700 calc(11pt*var(--tz)) var(--kid);font-style:normal;width:6.5mm;height:6.5mm;border:.3mm solid #999;border-radius:50%;display:grid;place-items:center;color:#333;background:#fafafa}.bank i.dc{color:#333}
.bank i.k{border-color:#e11d48;color:#e11d48}
.w1b{display:flex;gap:calc(1mm*var(--tz));justify-content:center;width:100%;flex:none}
.w1b .lb{flex:0 1 calc(8mm*var(--tz));min-width:0;width:auto;margin:0;border-radius:1.8mm;border-width:.35mm .35mm .7mm}
.tray{display:flex;flex-wrap:wrap;gap:calc(1mm*var(--tz));justify-content:center;align-items:center;background:#f3f5f7;border-radius:3mm;padding:calc(1.2mm*var(--tz)) 2.2mm;max-width:100%;flex:none}
.tray b{font:700 calc(8pt*var(--tz)) var(--ui);color:#8a9499;margin-right:.6mm}
.tray i{font:700 calc(10.5pt*var(--tz)) var(--kid);font-style:normal;min-width:calc(6.2mm*var(--tz));height:calc(6.2mm*var(--tz));padding:0 .8mm;box-sizing:border-box;border-radius:1.6mm;background:#fff;border:.25mm solid #cfd6d4;box-shadow:0 .4mm 0 #cfd6d4;display:grid;place-items:center;color:#333;line-height:1}
.tray i.k{border-color:#e11d48;box-shadow:0 .4mm 0 #e11d48;color:#e11d48;background:#fff1f3}
.sheet.bw .tray{background:#fff;border:.25mm dashed #999}
.cutg{display:grid;flex:1;min-height:0;border:.35mm dashed #888}
.card{border:.35mm dashed #888;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5mm;position:relative;min-height:0;overflow:hidden}
.card .sc{position:absolute;left:1.5mm;top:.5mm;font-size:9pt;color:#999}
.tick{display:inline-flex;gap:1.5mm;align-items:center;font:600 calc(9pt*var(--tk)) var(--ui);color:#555}
.tick i{width:calc(6mm*var(--tk));height:calc(6mm*var(--tk));border:.35mm solid #555;border-radius:1.2mm;display:inline-block}
.star{font-size:14pt;color:#bbb;letter-spacing:1mm}
.bub{border:.35mm solid #444;border-radius:4mm;padding:calc(1.5mm*var(--tk)) calc(3mm*var(--tk));font-size:var(--fs);position:relative;background:#fff}
/* Nana 26 Nov: Talk Back text without the black frame → more room for longer, bigger text */
/* Nana 26 Nov: Best Reply items without the outer box (only the question keeps its frame) → bigger text */
.it.nf{border:0;border-radius:0;padding:0}
.bub.nb{border:0;padding:0;border-radius:0;background:none;font-weight:700}
.half{flex:1;display:flex;flex-direction:column;gap:2.5mm;min-width:0;min-height:0}
.vcut{width:0;border-left:.4mm dashed #888;position:relative;flex:none}
.vcut::before{content:"✂";position:absolute;top:-1mm;left:-2.4mm;font-size:12pt;color:#666;background:#fff}
.dot{width:3mm;height:3mm;border-radius:50%;background:#111;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:11pt}
.tbl th{font:800 9pt var(--ui);text-align:left;color:#555;border-bottom:.4mm solid #333;padding:1.5mm 2mm}
.tbl td{border-bottom:.2mm solid #ccc;padding:1.6mm 2mm;vertical-align:middle}
.keyg{display:grid;gap:2mm 4mm;font-size:11pt;align-content:start}
.keyg div{display:flex;gap:2mm;align-items:center;border-bottom:.2mm dotted #bbb;padding:.8mm 0}
.keyg b{font:800 9.5pt var(--ui);width:6mm}
.keyg .a{color:#e11d48;font-weight:700}
.secT{font:800 11pt var(--ui);display:flex;gap:2mm;align-items:center;flex:none}
.secT .cd{color:#fff;border-radius:1.6mm;padding:.2mm 1.6mm;font-size:9pt}
.part{flex:1;min-height:0;display:flex;flex-direction:column;gap:2mm;overflow:hidden}
.part>.items,.part>.cutg{min-height:0;flex:1}
.sheet.bw .pic,.sheet.bw .qr{filter:grayscale(1) contrast(1.15)}
.sheet.bw .cd,.sheet.bw .no{background:#fff!important;color:#111!important;border:.35mm solid #111}
.sheet.bw .ins{background:#fff!important;border:.3mm solid #999}
.sheet.bw .hd1 .brand i{background:#111}
.sheet.bw .hd1 .brand{color:#111}

@media print{
 body{background:#fff}
 .page>*:not(#printroot){display:none!important}
 #printroot{display:block!important}
 #printroot .sheet{transform:none!important;break-after:page;page-break-after:always}
 .page{padding:0}
}
#printroot{display:none}
.pic img{height:1em;width:auto;max-width:1.6em;object-fit:contain;vertical-align:middle;display:inline-block}
/* set pictures used inside text (answer keys, teacher script): never bigger than the line */
.sheet img.vi{height:1.4em;width:auto;max-width:2.2em;object-fit:contain;vertical-align:middle;display:inline-block}
.sheet .tbl img.vi{height:calc(9mm*var(--pz,1));max-width:calc(14mm*var(--pz,1))}
.sheet .pic img.vi{height:1em;max-width:1.6em}
.live .mk{display:none}
.live .page{padding:0}
.live .frame{height:100dvh;min-height:0;border:0;border-radius:0}
.vsp{position:fixed;inset:0;z-index:200;background:rgba(17,24,39,.4);display:flex;align-items:flex-end;justify-content:center}
.vsp .box{background:#fff;width:min(560px,100%);max-height:85dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){.vsp{align-items:center}.vsp .box{border-radius:22px}}
.vsp .hd2{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.vsp .hd2 b{flex:1;font-size:17px}
.vsp .ls{overflow:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.vsp a{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px;text-decoration:none;color:var(--ink)}
.vsp a:hover,.vsp a.on{border-color:var(--p7);background:var(--mint2)}
.vsp a .e{font-size:28px;width:40px;text-align:center;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.vsp a small{color:var(--muted);display:block}
.vsp .x{border:1px solid var(--line);background:#fff;border-radius:10px;height:36px;min-width:36px;font-weight:700}
/* ===== L4 Bingo (Nana 25 Nov): 🎡 Spin button + wheel overlay + bingo cards ===== */
.top .sp{border:0;background:#1F1D3A;color:#fff;border-radius:12px;padding:7px 12px;font-weight:800;white-space:nowrap;box-shadow:0 3px 0 #0b0b18}
.top .sp[hidden]{display:none}
@container frame (max-width:699px){.top .sp{display:none}}
